services:
  - type: web
    name: agent-starter-react
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        sync: false
      - key: NEXT_PUBLIC_DEFAULT_AGENT_NAME
        value: my-agent
      - key: NEXT_PUBLIC_DYNAMIC_AGENT_NAME
        value: dynamic-agent
      - key: MONGODB_URI
        sync: false
      - key: TOKEN_ENDPOINT_ALLOWED_ORIGINS
        sync: false
      - key: TOKEN_ENDPOINT_RATE_LIMIT
        value: "60"
      - key: TOKEN_ENDPOINT_RATE_LIMIT_WINDOW_MS
        value: "60000"
